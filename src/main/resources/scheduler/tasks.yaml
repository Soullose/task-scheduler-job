# 任务定义：每条任务须声明 trigger 选择调度模式（二选一，其余相关字段与模式保持一致）：
#   trigger: cron     → 按 Spring 六字段秒级表达式（秒 分 时 日 月 周）墙钟网格触发，需配 cron。
#                       例如 "0 */3 * * * ?" = 每 3 分钟，只会落在 20:33:00 / 20:36:00 ...（第 0 秒）。
#   trigger: interval → 固定间隔触发（PeriodicTrigger），需配 interval，例如 "200s" = 每 200 秒一次
#                       （cron 表达不了的秒级周期）。注册后一个 interval 才首次触发（不会注册即执行），
#                       之后每 interval 一次；触发时刻 = 注册时刻 + k×interval（如 20:30:30 注册 + 3m
#                       → 20:33:30、20:36:30 ...）。如需启动立即执行一次，请配 run-on-startup: true。
#                       可选 interval-mode: rate | delay（默认 rate）：
#                         rate  = fixed-rate，每次 = 上次计划触发时刻 + interval，节奏不漂移；
#                         delay = fixed-delay，每次 = 上次完成时刻 + interval（业务在虚拟线程执行，
#                                防重叠仍由 allow-concurrent=false 闸门负责）。
tasks:
  - name: "data_sync"
    enabled: false
    trigger: cron
    cron: "*/5 * * * * ?" # 示例：每秒触发
    handler: "com.w3.taskscheduler.jobs.handler.DataSyncHandler" # 全限定类名
    description: "每秒同步一次数据（示例，仅演示秒级 cron）"
    timeout: 60s
    max-retries: 3
    retry-delay: 5s
    allow-concurrent: false
    params:
      source: "api"
      batch-size: 100

  - name: "sample_task"
    enabled: false
    trigger: cron
    cron: "0/2 * * * * ?" # 示例：每 2 秒触发
    handler: "com.w3.taskscheduler.jobs.task.SampleTask"
    params:
      format: "pdf"

  - name: "cache_cleanup"
    enabled: false
    trigger: cron
    cron: "0/3 * * * * ?" # 示例：每 3 秒触发
    handler: "com.w3.taskscheduler.jobs.handler.TestHandler"
    run-on-startup: true # 程序启动后立即执行一次（不依赖 cron）

  # interval 模式示例：每 200 秒执行一次（PeriodicTrigger，注册后一个 interval 才首次触发，不会立即执行）
  # - interval 与 cron 互斥，同一任务只能配置一个（由 trigger 决定）
  # - 若需要启动立即执行一次，配 run-on-startup: true 即可（与周期首次触发不重叠）
  # - interval-mode 可选：rate(默认，fixed-rate) / delay(fixed-delay)
  - name: "heartbeat_interval"
    enabled: true
    trigger: interval
    interval: 200s
    interval-mode: rate
    handler: "com.w3.taskscheduler.jobs.handler.TestHandler"
    description: "演示 interval 固定间隔调度：每 200 秒执行一次（rate 模式）"
    run-on-startup: false # 程序启动后立即执行一次（不依赖 cron）
